<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alimenta+ | Cadastro de Ponto</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --verde-institucional: #0e5a36;
      --verde-hover: #0a4328;
      --verde-suave: #f0f7f3;
      --bg: #f8faf8;
      --card: #ffffff;
      --texto-principal: #111827;
      --texto-secundario: #4b5563;
      --borda: #d1d5db;
      --borda-foco: #0e5a36;
      --sombra: rgba(0, 0, 0, 0.05);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--texto-principal);
      line-height: 1.5;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    nav {
      width: min(1120px, 92%);
      margin: 0 auto;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo a {
      text-decoration: none;
      color: var(--verde-institucional);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo strong {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.4rem;
      font-weight: 800;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 24px;
    }

    nav ul li a {
      text-decoration: none;
      color: var(--texto-secundario);
      font-size: 0.9rem;
      font-weight: 500;
    }

    .cadastro {
      width: min(840px, 92%);
      margin: 48px auto 80px;
      background: var(--card);
      padding: 48px 40px;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
      box-shadow: 0 4px 6px -1px var(--sombra);
    }

    .titulo-secao {
      margin-bottom: 36px;
      border-bottom: 1px solid #f3f4f6;
      padding-bottom: 24px;
    }

    .titulo-secao h2 {
      color: var(--verde-institucional);
      font-size: 0.85rem;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .titulo-secao h3 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    form {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px 24px;
    }

    .campo {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .campo-completo { grid-column: 1 / -1; }
    .campo-terco { grid-column: span 1; }

    label {
      font-size: 0.875rem;
      font-weight: 600;
    }

    input[type="text"], input[type="tel"], select, textarea {
      width: 100%;
      border: 1px solid var(--borda);
      border-radius: 6px;
      padding: 10px 14px;
      font-family: inherit;
      font-size: 0.925rem;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--borda-foco);
      box-shadow: 0 0 0 3px rgba(14, 90, 54, 0.1);
    }

    textarea { min-height: 100px; resize: vertical; }

    .opcoes { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
    .opcoes label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border: 1px solid var(--borda);
      border-radius: 6px;
      cursor: pointer;
    }

    button[type="submit"] {
      width: 100%;
      border: none;
      border-radius: 6px;
      padding: 12px 24px;
      background: var(--verde-institucional);
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }

    button[type="submit"]:hover { background: var(--verde-hover); }

    @media (max-width: 640px) {
      form { grid-template-columns: 1fr; }
      .opcoes { flex-direction: column; }
      .cadastro { margin: 32px auto 48px; padding: 32px 20px;}
      .titulo-secao h3 {font-size: 1.3rem;}
    }

    @media (max-width: 480px) {
      nav { flex-direction: column;
        justify-content: center;
        gap: 12px;
        height: auto;
        padding: 16px 0;}
    }

      nav ul {
        gap: 16px;
        justify-content: center;
        gap: 16px;
        flex-wrap: wrap;
    }
  </style>
</head>

<body>
  <header>
    <nav>
      <div class="logo">
        <a href="index.html"><strong>Alimenta+</strong></a>
      </div>
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="index.html#mapa">Mapa</a></li>
        <li><a href="index.html#contato">Contato</a></li>
      </ul>
    </nav>
  </header>

  <section id="cadastro" class="cadastro">
    <div class="titulo-secao">
      <h2>Cadastro de Ponto</h2>
      <h3>Conhece ou administra um local de distribuição?</h3>
      <p>Preencha os dados abaixo para integrar o ponto à nossa rede de mapeamento.</p>
    </div>

    <form action="backend/processamento.php" method="post">
      <div class="campo">
        <label for="nome-ponto">Nome do ponto *</label>
        <input type="text" id="nome-ponto" name="nome-ponto" placeholder="Ex.: Cozinha Solidária Esperança" required>
      </div>

      <div class="campo">
        <label for="responsavel">Nome do responsável *</label>
        <input type="text" id="responsavel" name="responsavel" placeholder="Ex.: Maria da Silva" required>
      </div>

      <div class="campo">
        <label for="logradouro">Logradouro / Rua *</label>
        <input type="text" id="logradouro" name="logradouro" placeholder="Ex.: Rua Exemplo" required>
      </div>

      <div class="campo">
        <label for="numero">Número *</label>
        <input type="text" id="numero" name="numero" placeholder="Ex.: 100 ou S/N" required>
      </div>

      <div class="campo">
        <label for="bairro">Bairro *</label>
        <input type="text" id="bairro" name="bairro" placeholder="Ex.: Centro" required>
      </div>

      <div class="campo">
        <label for="cidade">Cidade *</label>
        <input type="text" id="cidade" name="cidade" placeholder="Ex.: Ribeirão Pires" required>
      </div>

      <div class="campo">
        <label for="uf">UF (Estado) *</label>
        <select id="uf" name="uf" required>
          <option value="">Selecione...</option>
          <option value="SP">SP - São Paulo</option>
          <option value="RJ">RJ - Rio de Janeiro</option>
          <option value="MG">MG - Minas Gerais</option>
          <option value="PR">PR - Paraná</option>
          <option value="SC">SC - Santa Catarina</option>
          <option value="RS">RS - Rio Grande do Sul</option>
        </select>
      </div>

      <div class="campo">
        <label for="telefone">Telefone para contato *</label>
        <input type="tel" id="telefone" name="telefone" placeholder="(11) 99999-9999" required>
      </div>

      <div class="campo campo-completo">
        <label>Tipos de alimento distribuídos</label>
        <div class="opcoes">
          <label><input type="checkbox" name="alimento[]" value="Marmitas prontas"> Marmitas prontas</label>
          <label><input type="checkbox" name="alimento[]" value="Cestas básicas"> Cestas básicas</label>
          <label><input type="checkbox" name="alimento[]" value="Hortifrúti / Orgânicos"> Hortifrúti / Orgânicos</label>
          <label><input type="checkbox" name="alimento[]" value="Pães e panificados"> Pães e panificados</label>
        </div>
      </div>

      <div class="campo campo-completo">
        <label for="regras">Regras e requisitos para retirada</label>
        <textarea id="regras" name="regras" placeholder="Informe se há necessidade de cadastro prévio, documento, etc."></textarea>
      </div>

      <div class="campo campo-completo">
        <label for="observacoes">Observações adicionais</label>
        <textarea id="observacoes" name="observacoes" placeholder="Pontos de referência, acessibilidade PCD, etc."></textarea>
      </div>

      <div class="campo campo-completo">
        <label class="checkbox-termo">
          <input type="checkbox" name="confirmacao" value="1" required>
          Declaramos que as informações acima são precisas e representam um ponto ativo de apoio comunitário.
        </label>
      </div>

      <div class="campo campo-completo">
        <button type="submit">Enviar Formulário de Cadastro</button>
      </div>
    </form>
  </section>
</body>
</html>
